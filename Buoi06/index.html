!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MindX Cinema</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-12 sm:col-6 lg:col-4 d-flex flex-column justify-content-center">
                <div class="fs-5xl fw-bold" style="color: rgb(112, 2, 2);">Register</div>
                <div class="form-floating my-5">
                    <label for="floatingInput">Email address</label>
                    <input style="border-color: darkred;" type="email" class="form-control" id="floatingInput" placeholder="name@example.com">
                </div>
                <div class="form-floating my-5">
                    <label for="floatingPassword">Password</label>
                    <input style="border-color: darkred;" type="password" class="form-control" id="floatingPassword" placeholder="Password">
                </div>
                <div class="form-floating my-5">
                    <label for="floatingPassword">Confirm password</label>
                    <input style="border-color: darkred;" type="password" class="form-control" id="floatingConfirmPassword" placeholder="Confirm password">
                </div>
                <div class="my-5">
                    <a style="color: darkred" href="" class="fg-danger">Already have an account?</a> <!--//Muốn xóa gặt chân thì dùng "style="text-decoration: none"-->
                </div>
                <button style="background-color: darkred; color: white;" type="button" class="btn-solid text-1xl p-2">Create new account</button>
            </div>
            <div class="col-12 sm:col-6 lg:col-8 d-flex align-items-center">
                <img src="image/Made from Tommy.png" class="img-fluid w-100">
            </div>
        </div>
    </div>
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</body>
</html>
